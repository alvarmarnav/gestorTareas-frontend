@if (taskService.loading()) {
<div class="text-center py-4">
<div class="spinner-border text-primary" role="status">
<span class="visually-hidden">Cargando...</span>
</div>
</div>
}
@if (taskService.error()) {
<div class="alert alert-danger">
{{ taskService.error() }}
</div>
}
@if (!taskService.loading() && !taskService.error()) {

  @for (task of taskService.tasks(); track task.id) {
    <app-task-card
    [task]="task"
    (completeTask)="onComplete($event)"
    (deleteTask)="onDelete($event)"/>
  } @empty {
    <p class="text-muted">No hay tareas disponibles</p>
  }
}
<div class="d-flex justify-content-between align-items-center mb-3">
<h2>Mis tareas</h2>
<a routerLink="/tasks/newTask" class="btn btn-primary">+ Nueva tarea</a>
</div>
