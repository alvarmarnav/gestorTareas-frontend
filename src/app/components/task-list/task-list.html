@if (tasks().length === 0) {
  <p>No existen tareas que mostrar.</p>
} @else {
  <p>{{ tasks().length }} tareas - {{ totalTasks() }} están pendientes.</p>
  @for (task of tasks(); track task.id) {
    <app-task-card [task]="task"
    (completTask)="onComplete($event)"
    (deleteTask)="onDelete($event)"/>
  } @empty {
    <p class="text-muted">No hay tareas disponibles</p>
  }
}
