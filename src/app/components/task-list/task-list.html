<div class="flex flex-wrap justify-between items-center mb-3 container">
  @if (taskService.loading()) {
    <div class="w-full flex justify-center py-6">
      <div
        class="h-8 w-8 border-4 border-blue-500 border-t-transparent rounded-full animate-spin"
      ></div>
    </div>
  }
  @if (taskService.error()) {
    <div class="w-full bg-red-100 text-red-700 border border-red-300 px-4 py-3 rounded-lg">
      {{ taskService.error() }}
    </div>
  }
  @if (!taskService.loading() && !taskService.error()) {
  <div class="grid grid-cols-1 gap-x-6 gap-y-8 justify-items-center sm:grid-cols-2 lg:grid-cols-3">
    
    @for (task of taskService.tasks(); track task.id) {
      <app-task-card
        [task]="task"
        (completeTask)="onComplete($event)"
        (deleteTask)="onDelete($event)"
        class="block w-full max-w-sm"
      />
    } @empty {
      <p class="col-span-full w-full rounded-xl border border-dashed border-gray-300 bg-white p-8 text-center text-gray-500">No hay tareas disponibles</p>
    }
  </div>
  }


  <a routerLink="/tasks/newTask" class="bg-blue-600 text-white px-4 py-2 rounded-lg shadow hover:bg-blue-700 transition">+ Nueva tarea</a>
</div>
