@if (!isLoginPage()) {
<nav
  class="fixed top-0 left-0 z-50 flex w-full items-center justify-between bg-white/30 py-2 backdrop-blur-xl transition-all dark:bg-transparent md:p-3">
  <div class="mx-auto flex max-w-7xl items-center justify-between gap-4">
    <a routerLink="/tasks" class="text-2xl font-bold text-zinc-950">TM</a>

    @if (authService.isAuthenticated()) {
    <div class="flex items-center gap-2">
      <a routerLink="/tasks" routerLinkActive="bg-blue-100 text-blue-700"
        class="rounded-lg px-3 py-2 text-sm font-semibold text-gray-700 hover:bg-gray-100">
        Tareas
      </a>
      <a routerLink="/tasks/newTask" routerLinkActive="bg-blue-100 text-blue-700"
        class="rounded-lg px-3 py-2 text-sm font-semibold text-gray-700 hover:bg-gray-100">
        Nueva tarea
      </a>
      <button type="button"
        class="rounded-lg border border-red-200 px-3 py-2 text-sm font-semibold text-red-600 transition hover:bg-red-600 hover:text-white"
        (click)="onLogout()">
        Salir
      </button>
    </div>
    }
  </div>
</nav>
}
