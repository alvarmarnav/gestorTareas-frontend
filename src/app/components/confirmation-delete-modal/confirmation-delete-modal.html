@if (isOpen) {
  <div
    class="fixed inset-0 z-50 flex items-center justify-center bg-black/40 px-4"
    role="dialog"
    aria-modal="true"
    aria-labelledby="delete-modal-title"
    (click)="onClose($event)"
  >
    <div
      class="w-full max-w-md rounded-3xl border border-gray-200 bg-white p-6 shadow-lg"
      (click)="stopPropagation($event)"
    >
      <div class="mb-5">
        <div class="mb-4 flex h-12 w-12 items-center justify-center rounded-full bg-red-100">
          <span class="text-2xl text-red-600">!</span>
        </div>

        <h2 id="delete-modal-title" class="mb-2 text-xl font-bold text-gray-900">
          {{ title }}
        </h2>

        <p class="text-sm leading-6 text-gray-600">
          {{ message }}
          @if (itemName) {
            <span class="font-semibold text-gray-900"> "{{ itemName }}" </span>
          }
        </p>
        @if (warning) {
          <p class="mt-3 rounded-xl border border-red-200 bg-red-50 p-3 text-sm text-red-700">
            {{ warning }}
          </p>
        }
      </div>

      <div class="flex flex-col-reverse gap-3 sm:flex-row sm:justify-end">
        <button
          type="button"
          class="rounded-xl border border-gray-300 px-5 py-3 text-sm font-semibold text-gray-700 transition hover:bg-gray-100"
          [disabled]="isLoading"
          (click)="onClose($event)"
        >
          {{cancelText}}
        </button>

        <button
          type="button"
          class="rounded-xl bg-red-600 px-5 py-3 text-sm font-semibold text-white shadow transition hover:bg-red-700 disabled:cursor-not-allowed disabled:bg-gray-300 disabled:text-gray-500"
          [disabled]="isLoading"
          (click)="onConfirm($event)"
        >
          {{isLoading ? 'Eliminar..' : confirmText}}
        </button>
      </div>
    </div>
  </div>
}
